name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components tests

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace
          -e PYTHONPATH=/workspace/custom_components
          -e PYTHONDONTWRITEBYTECODE=1
          --entrypoint python3
          ghcr.io/home-assistant/home-assistant:2026.9.3
          -m unittest discover -s tests -v

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
